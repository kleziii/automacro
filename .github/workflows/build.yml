name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  GEODE_VERSION: 5.8.2
  MOD_ID: pl.automacro

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Win64
          sdk: v${{ env.GEODE_VERSION }}
          build-config: Release

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Merge platform binaries
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ID }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
